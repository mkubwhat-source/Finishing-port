# Project
version=4.0.0-26.3
group=net.hecco.bountifulfares
java_version=25

# Minecraft / Fabric
minecraft_version=26.3
mod_name=Bountiful Fares
mod_author=Hecco
mod_id=bountifulfares
license=All Rights Reserved (Modified)
credits=
description=Adds new content to the food and farming side of Minecraft!
minecraft_version_range=[26.3, 26.4)

# ParchmentMC mappings - no 26.3 build published yet as of this port; leave unset until one
# lands (see PORTING_26.3.md). Mojang mappings alone are used in the meantime.
# parchment_minecraft=26.3
# parchment_version=

fabric_loader_version=0.19.5
fabric_version=0.161.0+26.3
# Ground-truth for the 26.3 toolchain (Minecraft dropped jar obfuscation this version line,
# so there are no more client_mappings/server_mappings to fetch - confirmed by checking
# piston-meta's 26.3 version JSON directly, and by checking that Fabric's own intermediary
# for 26.3 is the "0.0.0" no-op stub). fabric-loom 1.18.2 (the latest *stable* release) still
# unconditionally tries to download client_mappings/server_mappings and fails; the fix, taken
# straight from FabricMC/fabric-example-mod's own "26.3" branch, is the 1.17-SNAPSHOT loom
# build with no `mappings` block at all.
loom_version=1.17-SNAPSHOT

modmenu_version=21.0.0-beta.1
cloth_config_version=26.3.158+fabric

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
